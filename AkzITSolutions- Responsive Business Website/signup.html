<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AkzITSolutions</title>
    <meta name="description" content="Create your developer portal account and start managing your cloud applications at AkzITSolutions.">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Sticky Navigation Header -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo" aria-label="AkzITSolutions Home">
                <i class="fa-solid fa-cube logo-icon"></i> AkzITSolutions
            </a>
            
            <!-- CSS Checkbox Hack for Hamburger Menu -->
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon" aria-label="Toggle Navigation Menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="signup.html" class="btn btn-secondary nav-link-btn">Get Started</a>
            </nav>

            <div class="nav-actions">
                <a href="login.html" class="btn btn-secondary" style="padding: 0.5rem 1.25rem;">Sign In</a>
                <a href="signup.html" class="btn btn-primary" style="padding: 0.5rem 1.25rem;">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join the next-generation developer platform</p>
            </div>
            
            <!-- Signup Form with CSS validation patterns -->
            <form action="dashboard-profile.html" method="GET" onsubmit="alert('Signup Simulator: Redirecting to Dashboard Profile');">
                <div class="form-group">
                    <label for="reg-name" class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required minlength="3" pattern="^[a-zA-Z\s]+$">
                </div>

                <div class="form-group">
                    <label for="reg-email" class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="jane@company.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password" class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="reg-confirm" class="form-label">Confirm Password</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required minlength="8">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="reg-terms" required>
                    <label for="reg-terms">
                        I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </main>

</body>
</html>
