<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AkzITSolutions</title>
    <meta name="description" content="Log in to your AkzITSolutions dashboard portal to monitor cloud resource analytics.">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Sticky Navigation Header -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo" aria-label="AkzITSolutions Home">
                <i class="fa-solid fa-cube logo-icon"></i> AkzITSolutions
            </a>
            
            <!-- CSS Checkbox Hack for Hamburger Menu -->
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon" aria-label="Toggle Navigation Menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="login.html" class="nav-link active">Login</a>
                <a href="signup.html" class="btn btn-secondary nav-link-btn">Get Started</a>
            </nav>

            <div class="nav-actions">
                <a href="login.html" class="btn btn-secondary" style="padding: 0.5rem 1.25rem;">Sign In</a>
                <a href="signup.html" class="btn btn-primary" style="padding: 0.5rem 1.25rem;">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to access your secure console</p>
            </div>
            
            <!-- Login Form with CSS validation patterns -->
            <form action="dashboard-profile.html" method="GET" onsubmit="alert('Login Simulator: Redirecting to User Dashboard');">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="john@company.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required minlength="8">
                </div>

                <div class="auth-options">
                    <label class="checkbox-group" style="margin-bottom:0;">
                        <input type="checkbox" id="login-remember">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" onclick="alert('Password reset link simulator triggered.');">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </main>

</body>
</html>
